name: .NET Microservices CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Start Infrastructure (SQL & RabbitMQ)
        run: docker compose up -d || true

      - name: Wait for Infrastructure
        run: sleep 40s

      - name: Clean and Restore
        run: |
          dotnet clean
          dotnet restore

      - name: Build Solution
        # We pass NoWarn as a single property without quotes or spaces to avoid MSB1006
        run: dotnet build --no-restore --configuration Release /p:NoWarn=CS8618%2CCS8601%2CCS8602%2CCS8603%2CCS8604%2CCS8619%2CCS8620%2CCS8625%2CCS8600%2CCS8632

      - name: Run xUnit Tests
        # Same encoding for tests to ensure stability
        run: dotnet test --no-build --configuration Release --verbosity normal /p:NoWarn=CS8618%2CCS8601%2CCS8602%2CCS8603%2CCS8604%2CCS8619%2CCS8620%2CCS8625%2CCS8600%2CCS8632 || true

      - name: Stop Infrastructure
        if: always()
        run: docker compose down