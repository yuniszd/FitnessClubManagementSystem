version: '3.8'

services:
  # SQL Server container
  fcms-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fcms-sql
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    networks:
      - fcms-net

  # RabbitMQ container
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - fcms-net

networks:
  fcms-net:
    driver: bridge