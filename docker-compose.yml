version: '3.9'

services:
  fcms-api:
    build: ./src/FCMS.Api
    container_name: fcms-api
    depends_on:
      - fcms-sql
      - rabbitmq
    environment:
      - DOTNET_ENVIRONMENT=Docker
    ports:
      - "5000:80"
    networks:
      - fcms-net

  fcms-sql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: fcms-sql
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    networks:
      - fcms-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - fcms-net

networks:
  fcms-net:
    driver: bridge
